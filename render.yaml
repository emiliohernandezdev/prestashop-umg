services:
  # Servidor de Base de Datos MySQL
  - type: pserv
    name: prestashop-db
    env: docker
    dockerfilePath: ./Dockerfile.mysql
    repo: https://github.com/tu-usuario/tu-repo # Cambia por la URL de tu repositorio
    plan: starter # O el plan que prefieras
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        value: RootPasswordSegura123!
      - key: MYSQL_DATABASE
        value: prestashop
      - key: MYSQL_USER
        value: prestashop_user
      - key: MYSQL_PASSWORD
        value: PrestaPassword123!

  # Servicio Web de PrestaShop
  - type: web
    name: prestashop-web
    env: docker
    dockerfilePath: ./Dockerfile
    repo: https://github.com/tu-usuario/tu-repo # Cambia por la URL de tu repositorio
    plan: starter
    disk:
      name: prestashop-files
      mountPath: /var/www/html
      sizeGB: 10
    envVars:
      - key: PORT
        value: 10000
      - key: DB_SERVER
        value: prestashop-db:3306
      - key: DB_NAME
        value: prestashop
      - key: DB_USER
        value: prestashop_user
      - key: DB_PASSWD
        value: PrestaPassword123!
      - key: PS_INSTALL_AUTO
        value: "1"
      - key: PS_DOMAIN
        generateValue: true # Render asignará automáticamente la URL pública de tu web service
      - key: ADMIN_MAIL
        value: admin@ejemplo.com
      - key: ADMIN_PASSWD
        value: AdminPasswordSegura123!
