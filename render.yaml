services:
  # Servicio 1: Base de datos MySQL Privada
  - type: pserv
    name: mysql-prestashop
    env: docker
    dockerfilePath: Dockerfile.mysql
    plan: free
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        value: root_password_123
      - key: MYSQL_DATABASE
        value: prestashop
      - key: MYSQL_USER
        value: prestashop_user
      - key: MYSQL_PASSWORD
        value: prestashop_password_123
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 1

  # Servicio 2: Aplicación PrestaShop
  - type: web
    name: prestashop-umg
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000
      - key: DB_SERVER
        value: mysql-prestashop:3306
      - key: DB_NAME
        value: prestashop
      - key: DB_USER
        value: prestashop_user
      - key: DB_PASSWD
        value: prestashop_password_123
      - key: PS_DOMAIN
        value: prestashop-umg.onrender.com
      - key: PS_INSTALL_AUTO
        value: "1"
      - key: ADMIN_MAIL
        value: admin@ejemplo.com
      - key: ADMIN_PASSWD
        value: TuPasswordSeguro123